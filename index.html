<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#3F6B4F" />
<title>Ons lijstje</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.12.3/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #EFF3EA; }
  :root {
    --bg: #EFF3EA;
    --surface: #FFFFFF;
    --ink: #24352B;
    --ink-muted: #7C8B7F;
    --primary: #3F6B4F;
    --primary-dark: #2C4D38;
    --primary-light: #DCE8D6;
    --accent: #E7A72C;
    --danger: #B54B3A;
    --line: #E1E6DB;
  }
  .app-shell { color: var(--ink); min-height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }
  h1, h2, h3 { font-family: 'Fredoka', sans-serif; margin: 0; }

  .loading-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 100vh; color: var(--ink-muted); font-size: 14px; text-align: center; padding: 24px;
  }
  .loading-wrap.error { color: var(--danger); }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 14px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand h1 { font-size: 22px; font-weight: 600; color: var(--primary-dark); }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .avatar-btn { background: none; border: none; padding: 0; cursor: pointer; }
  .avatar {
    border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif; font-weight: 600; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .segmented { display: flex; margin: 0 18px 6px; background: var(--surface); border-radius: 12px; padding: 4px; gap: 4px; }
  .segmented button {
    flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 9px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink-muted); cursor: pointer;
  }
  .segmented button.active { background: var(--primary); color: #fff; }

  .view-pad { padding: 6px 18px 100px; }

  .add-form { background: var(--surface); border-radius: 16px; padding: 10px; margin: 10px 0 16px; box-shadow: 0 2px 10px rgba(36,53,43,0.06); }
  .add-form-main { display: flex; gap: 8px; }
  .add-form-extra { display: flex; gap: 8px; margin-top: 8px; }
  .text-input {
    flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 15px; font-family: 'Inter', sans-serif; color: var(--ink); background: #fff; min-width: 0;
  }
  .text-input:focus { outline: none; border-color: var(--primary); }
  .text-input.small { font-size: 14px; }

  .btn-primary, .btn-secondary, .btn-danger {
    border: none; border-radius: 10px; padding: 10px 16px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:disabled { background: #A9BBA8; cursor: not-allowed; }
  .btn-secondary { background: var(--primary-light); color: var(--primary-dark); }
  .btn-danger { background: #FBEAE6; color: var(--danger); }
  .btn-primary.full, .btn-secondary.full, .btn-danger.full { width: 100%; }
  .btn-primary.square { width: 42px; height: 42px; padding: 0; flex-shrink: 0; border-radius: 10px; }

  .item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    background: var(--surface); border-radius: 12px; border-left: 5px solid var(--line);
    padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 1px 4px rgba(36,53,43,0.05);
  }
  .item-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 500; }
  .item-name.strike { text-decoration: line-through; color: var(--ink-muted); }
  .item-sub { font-size: 12.5px; color: var(--ink-muted); margin-top: 1px; }

  .check-circle {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--primary);
    background: #fff; color: var(--primary); display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; padding: 0;
  }
  .check-circle:hover { background: var(--primary); color: #fff; }

  .icon-btn {
    background: none; border: none; cursor: pointer; color: var(--primary);
    display: flex; align-items: center; justify-content: center; padding: 4px; flex-shrink: 0;
  }
  .icon-btn.muted { color: var(--ink-muted); }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--ink-muted); }
  .empty-icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  }
  .empty-state h3 { font-size: 16px; color: var(--ink); margin-bottom: 4px; }
  .empty-state p { font-size: 13.5px; margin: 0; max-width: 260px; margin-inline: auto; }

  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .card-group + .card-group { margin-top: 22px; }
  .card-group-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; color: var(--ink-muted);
    font-family: 'Inter', sans-serif; margin: 0 0 2px;
  }
  .card-group-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .loyalty-card {
    position: relative;
    aspect-ratio: 1.586; border: none; border-radius: 14px; box-shadow: 0 3px 8px rgba(36,53,43,0.15);
    display: flex; align-items: flex-end; padding: 12px; cursor: pointer;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; text-align: left;
  }
  .loyalty-card-logo {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 8px;
    background: #fff; object-fit: contain; padding: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .add-card-btn { margin-top: 18px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line);
    display: flex; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .nav-btn {
    flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 600; color: var(--ink-muted); padding: 6px 0; cursor: pointer;
  }
  .nav-btn.active { color: var(--primary); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(36,53,43,0.35); display: flex; align-items: flex-end; z-index: 40; }
  .sheet-backdrop.align-top { align-items: flex-start; }
  .sheet {
    background: var(--bg); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 20px 20px 0 0;
    padding: 10px 18px 26px; max-height: 86vh; overflow-y: auto;
  }
  .sheet-backdrop.align-top .sheet {
    border-radius: 0 0 20px 20px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
  }
  .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-header h2 { font-size: 18px; color: var(--primary-dark); }

  .member-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .member-row {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: none; border-radius: 12px;
    padding: 10px 12px; font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; width: 100%;
    font-family: 'Inter', sans-serif;
  }

  .stack { display: flex; flex-direction: column; gap: 8px; }
  .field-label { font-size: 12.5px; font-weight: 600; color: var(--ink-muted); margin-top: 4px; }
  .swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch { width: 100%; aspect-ratio: 1; border-radius: 50%; border: none; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5); padding: 0; }
  .swatch-active { box-shadow: 0 0 0 3px var(--ink); }
  .row-gap { display: flex; gap: 8px; margin-top: 6px; }
  .row-gap .btn-primary { flex: 1; }

  .pick-wrap { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .pick-canvas { width: 100%; border-radius: 12px; cursor: crosshair; display: block; }
  .pick-canvas.picking { box-shadow: 0 0 0 2px var(--accent); }
  .hint { font-size: 12.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 5px; margin: 0; }
  .hidden-input { display: none; }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-input { width: 44px; height: 44px; border: none; border-radius: 10px; padding: 0; background: none; cursor: pointer; }
  .color-preview {
    flex: 1; height: 44px; border-radius: 10px; display: flex; align-items: center; padding: 0 14px;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px;
  }

  .card-detail { display: flex; flex-direction: column; gap: 14px; }
  .card-detail-img { width: 100%; border-radius: 14px; display: block; }
  .card-detail-placeholder {
    width: 100%; aspect-ratio: 1.586; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px;
  }

  .code-type-toggle { display: flex; background: var(--surface); border-radius: 12px; padding: 4px; gap: 4px; }
  .code-type-toggle button {
    flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 9px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--ink-muted); cursor: pointer;
  }
  .code-type-toggle button.active { background: var(--primary); color: #fff; }
  .code-box {
    background: #fff; border-radius: 14px; padding: 18px;
    display: flex; align-items: center; justify-content: center; min-height: 90px;
    color: var(--ink-muted); font-size: 13px; text-align: center;
  }
  .code-box img, .code-box canvas {
    max-width: 100%; height: auto;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .code-box-detail { padding: 28px; min-height: 160px; }
  .wishlist-member-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .wishlist-member-btn {
    border: none; border-radius: 16px; padding: 22px 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 3px 8px rgba(36,53,43,0.15);
  }
  .wishlist-member-btn span {
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: #fff;
  }
  .wishlist-header-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; }
  .wishlist-owner-title { flex: 1; font-size: 19px; color: var(--primary-dark); }
  .wishlist-items { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .wishlist-item-row {
    background: var(--surface); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 4px rgba(36,53,43,0.05);
  }
  .wishlist-thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .wishlist-thumb-empty {
    background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center;
  }
  .card-detail-logo {
    width: 64px; height: 64px; border-radius: 14px; object-fit: contain; background: #fff;
    padding: 6px; align-self: center; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .logo-preview-row { display: flex; align-items: center; gap: 10px; }
  .logo-preview-row .btn-secondary { flex: 1; }
  .logo-thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; background: #fff; padding: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); flex-shrink: 0; }

  .member-pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .member-pill {
    border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 7px 14px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px;
    color: var(--ink-muted); cursor: pointer;
  }
  .member-pill.active { background: var(--pill-color, var(--primary)); border-color: transparent; color: #fff; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="loading-view" class="loading-wrap">Verbinden met de gedeelde lijst…</div>
  <div id="app-content" style="display:none;">
    <div id="topbar-root"></div>
    <div id="segmented-root"></div>
    <div id="view-root"></div>
    <div id="nav-root"></div>
  </div>
  <div id="sheet-root"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWU2UZ2LnyjDsUj-ATgsaH00FFCw9plSY",
  authDomain: "boodschappenlijstje-a1b57.firebaseapp.com",
  projectId: "boodschappenlijstje-a1b57",
  storageBucket: "boodschappenlijstje-a1b57.firebasestorage.app",
  messagingSenderId: "106584818891",
  appId: "1:106584818891:web:492715147cfa2b78a0074e",
  measurementId: "G-WY061VB75F"
};

let db = null;
let firebaseReady = false;
let firebaseError = null;

try {
  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  db = getFirestore(fbApp);
  await signInAnonymously(auth);
  firebaseReady = true;
} catch (e) {
  console.error("Firebase kon niet starten:", e);
  firebaseError = e;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function initials(name) { return (name || '?').trim().slice(0, 1).toUpperCase(); }
function itemMeta(item) {
  const parts = [];
  if (item.amount) parts.push(item.amount + 'x');
  if (item.weight) parts.push(item.weight);
  return parts.join(' · ');
}
function textColorFor(bgHex) {
  const c = (bgHex || '#3F6B4F').replace('#', '');
  const r = parseInt(c.substring(0, 2), 16);
  const g = parseInt(c.substring(2, 4), 16);
  const b = parseInt(c.substring(4, 6), 16);
  const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luma > 0.6 ? '#24352B' : '#FFFFFF';
}
function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

const MEMBER_COLORS = ['#E4572E','#3F88C5','#DB6CB2','#4C9F70','#F2B134','#7C5CBF','#2E86AB','#D64550','#1B998B','#F45B69'];

function icon(name, size) {
  size = size || 20;
  const paths = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/>',
    check: '<polyline points="5 13 10 18 19 7"/>',
    trash: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
    rotate: '<path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/>',
    cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h8.2a2 2 0 0 0 2-1.6L21 8H6"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/>',
    pipette: '<path d="M15 5l4 4"/><path d="M4 20l1-4 9-9 3 3-9 9-4 1z"/>',
    upload: '<path d="M12 16V4"/><polyline points="7 9 12 4 17 9"/><path d="M4 20h16"/>',
    arrowleft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    gift: '<rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M3 8h18"/><path d="M12 8v13"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C9.5 3 12 5 12 8"/><path d="M16.5 8a2.5 2.5 0 0 0 0-5C14.5 3 12 5 12 8"/>',
    bag: '<path d="M6.5 7h11l-1 13.5h-9L6.5 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/>',
    share: '<circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><line x1="8.1" y1="10.7" x2="15.9" y2="6.4"/><line x1="8.1" y1="13.3" x2="15.9" y2="17.6"/>',
  };
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">' + (paths[name] || '') + '</svg>';
}

const state = {
  members: [], items: [], log: [], cards: [],
  purchaseItems: [], purchaseLog: [], wishlistItems: [],
  currentMemberId: localStorage.getItem('current-member-id') || null,
  tab: 'list', listSub: 'active', purchaseSub: 'active', wishlistMemberId: null,
  sheet: null,
};

function currentMember() { return state.members.find((m) => m.id === state.currentMemberId) || null; }
function memberById(id) { return state.members.find((m) => m.id === id); }

function avatarHTML(m, size) {
  size = size || 36;
  if (!m) return '';
  return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;background:' + m.color + ';font-size:' + Math.round(size * 0.42) + 'px;">' + esc(initials(m.name)) + '</div>';
}
function emptyStateHTML(iconSvg, title, text) {
  return '<div class="empty-state"><div class="empty-icon">' + iconSvg + '</div><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></div>';
}

function renderTopbar() {
  const m = currentMember();
  document.getElementById('topbar-root').innerHTML =
    '<div class="topbar">' +
      '<div class="brand"><span class="brand-dot"></span><h1>Ons lijstje</h1></div>' +
      (m ? '<button class="avatar-btn" data-action="open-switcher">' + avatarHTML(m, 36) + '</button>' : '') +
    '</div>';
}

function renderSegmented() {
  const root = document.getElementById('segmented-root');
  if (state.tab === 'list') {
    root.innerHTML =
      '<div class="segmented">' +
        '<button class="' + (state.listSub === 'active' ? 'active' : '') + '" data-action="set-listsub" data-value="active">Lijst' + (state.items.length ? ' (' + state.items.length + ')' : '') + '</button>' +
        '<button class="' + (state.listSub === 'log' ? 'active' : '') + '" data-action="set-listsub" data-value="log">Logboek' + (state.log.length ? ' (' + state.log.length + ')' : '') + '</button>' +
      '</div>';
  } else if (state.tab === 'purchases') {
    root.innerHTML =
      '<div class="segmented">' +
        '<button class="' + (state.purchaseSub === 'active' ? 'active' : '') + '" data-action="set-purchasesub" data-value="active">Lijst' + (state.purchaseItems.length ? ' (' + state.purchaseItems.length + ')' : '') + '</button>' +
        '<button class="' + (state.purchaseSub === 'log' ? 'active' : '') + '" data-action="set-purchasesub" data-value="log">Logboek' + (state.purchaseLog.length ? ' (' + state.purchaseLog.length + ')' : '') + '</button>' +
      '</div>';
  } else {
    root.innerHTML = '';
  }
}

function renderView() {
  const root = document.getElementById('view-root');
  if (state.tab === 'list') {
    root.innerHTML = state.listSub === 'active' ? listViewHTML() : logViewHTML();
  } else if (state.tab === 'purchases') {
    root.innerHTML = state.purchaseSub === 'active' ? purchasesListViewHTML() : purchasesLogViewHTML();
  } else if (state.tab === 'wishlist') {
    root.innerHTML = wishlistViewHTML();
    wireWishlistView();
  } else {
    root.innerHTML = cardsViewHTML();
  }
}

function itemRowHTML(item, kind) {
  kind = kind || 'item';
  const m = memberById(item.memberId);
  const meta = itemMeta(item);

function wireWishlistView() {
  const nameInput = document.getElementById('wish-name-input');
  if (!nameInput) return;
  const storeInput = document.getElementById('wish-store-input');
  const priceInput = document.getElementById('wish-price-input');
  const photoWrap = document.getElementById('wish-photo-wrap');
  const photoInput = document.getElementById('wish-photo-input');
  const saveBtn = document.getElementById('wish-save-btn');
  let photoData = null;

  function renderPhotoWrap() {
    photoWrap.innerHTML = '';
    if (!photoData) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-secondary full';
      btn.innerHTML = icon('upload', 18) + ' Foto toevoegen (optioneel)';
      btn.addEventListener('click', () => photoInput.click());
      photoWrap.appendChild(btn);
      return;
    }
    const row = document.createElement('div');
    row.className = 'logo-preview-row';
    const img = document.createElement('img');
    img.src = photoData;
    img.className = 'logo-thumb';
    row.appendChild(img);
    const otherBtn = document.createElement('button');
    otherBtn.type = 'button';
    otherBtn.className = 'btn-secondary';
    otherBtn.textContent = 'Andere kiezen';
    otherBtn.addEventListener('click', () => photoInput.click());
    row.appendChild(otherBtn);
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'icon-btn muted';
    removeBtn.innerHTML = icon('x', 16);
    removeBtn.addEventListener('click', () => { photoData = null; renderPhotoWrap(); });
    row.appendChild(removeBtn);
    photoWrap.appendChild(row);
  }
  renderPhotoWrap();

  photoInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 300;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        photoData = canvas.toDataURL('image/jpeg', 0.85);
        renderPhotoWrap();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  saveBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    saveBtn.disabled = true;
    await addWishlistItem({
      name,
      store: storeInput.value.trim(),
      price: priceInput.value.trim(),
      image: photoData,
      memberId: state.wishlistMemberId,
    });
  });
}

function generateWishlistPDF(memberId) {
  if (!window.jspdf) { alert('PDF-bibliotheek kon niet laden. Controleer je internetverbinding.'); return; }
  const member = memberById(memberId);
  const items = state.wishlistItems.filter((i) => i.memberId === memberId);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  let y = 56;
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(20);
  pdf.text('Wensenlijst - ' + (member ? member.name : ''), 40, y);
  y += 26;
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(11);
  if (items.length === 0) {
    pdf.text('Nog geen items op deze wensenlijst.', 40, y);
  }
  items.forEach((item) => {
    if (y > 740) { pdf.addPage(); y = 56; }
    let imgH = 0;
    if (item.image) {
      try {
        const props = pdf.getImageProperties(item.image);
        const imgW = 64;
        imgH = (props.height / props.width) * imgW;
        const fmt = item.image.indexOf('image/png') !== -1 ? 'PNG' : 'JPEG';
        pdf.addImage(item.image, fmt, 40, y, imgW, imgH);
      } catch (e) { /* skip broken image */ }
    }
    const textX = item.image ? 116 : 40;
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(12);
    pdf.text(item.name, textX, y + 16);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(10.5);
    const metaParts = [];
    if (item.store) metaParts.push('Winkel: ' + item.store);
    if (item.price) metaParts.push('Bedrag: € ' + item.price);
    if (metaParts.length) pdf.text(metaParts.join('   ·   '), textX, y + 32);
    y += Math.max(imgH, 46) + 14;
  });
  pdf.save('Wensenlijst-' + (member ? member.name.replace(/[^a-z0-9]+/gi, '-') : 'lijst') + '.pdf');
}

      '<input id="card-name-input" class="text-input" placeholder="Bijv. Delhaize" autocomplete="off" />' +
      '<label class="field-label">Kaartcode / nummer</label>' +
      '<input id="card-code-input" class="text-input" placeholder="Bijv. 5412345678901" autocomplete="off" />' +
      '<span class="field-label">Type code</span>' +
      '<div class="code-type-toggle" id="card-type-toggle">' +
        '<button type="button" class="active" data-type="barcode">Streepjescode</button>' +
        '<button type="button" data-type="qr">QR-code</button>' +
      '</div>' +
      '<div id="card-code-preview" class="code-box">Vul een code in om een voorbeeld te zien</div>' +
      '<span class="field-label">Logo (optioneel)</span>' +
      '<div id="card-logo-wrap">' +
        '<button class="btn-secondary full" id="choose-logo-btn" type="button">' + icon('upload', 18) + ' Kies logo</button>' +
      '</div>' +
      '<input id="card-logo-input" type="file" accept="image/*" class="hidden-input" />' +
      '<span class="field-label">Kleur van de knop</span>' +
      '<div class="color-row">' +
        '<input id="card-color-input" type="color" value="#3F6B4F" class="color-input" />' +
        '<div id="card-color-preview" class="color-preview" style="background:#3F6B4F;color:#FFFFFF">Voorbeeld</div>' +
      '</div>' +
      '<button class="btn-primary full" id="save-card-btn" type="button">Kaart opslaan</button>' +
    '</div>';
  return sheetWrap('Nieuwe klantenkaart', body, true);
}

function barcodeFormatFor(code) {
  if (/^\d+$/.test(code)) {
    if (code.length === 13) return 'EAN13';
    if (code.length === 12) return 'UPC';
    if (code.length === 8) return 'EAN8';
  }
  return 'CODE128';
}

function renderCode(container, code, type, size) {
  container.innerHTML = '';
  if (!code) {
    container.textContent = 'Vul een code in om een voorbeeld te zien';
    return;
  }
  if (type === 'qr') {
    try {
      new QRCode(container, { text: code, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    } catch (e) {
      container.textContent = 'Kan geen QR-code maken van deze tekst.';
    }
  } else {
    const canvas = document.createElement('canvas');
    container.appendChild(canvas);
    const opts = { displayValue: true, width: 3, height: Math.round(size * 0.5), margin: 8 };
    try {
      JsBarcode(canvas, code, Object.assign({ format: barcodeFormatFor(code) }, opts));
    } catch (e) {
      try {
        JsBarcode(canvas, code, Object.assign({ format: 'CODE128' }, opts));
      } catch (e2) {
        container.textContent = 'Deze code kan niet als streepjescode getoond worden.';
      }
    }
  }
}

function cardDetailSheetHTML(sheet) {
  const card = sheet.card;
  const logoHTML = card.logo ? '<img src="' + card.logo + '" alt="" class="card-detail-logo" />' : '';
  const body =
    '<div class="card-detail">' +
      '<div id="card-detail-code" class="code-box code-box-detail"></div>' +
      logoHTML +
      '<button class="btn-secondary full" data-action="edit-card" data-id="' + card.id + '">' + icon('pencil', 17) + ' Kaart bewerken</button>' +
      '<button class="btn-danger full" data-action="delete-card" data-id="' + card.id + '">' + icon('trash', 17) + ' Kaart verwijderen</button>' +
    '</div>';
  return sheetWrap(card.name, body, true, 'top');
}

function renderSheetRoot() {
  const root = document.getElementById('sheet-root');
  if (!state.sheet) { root.innerHTML = ''; return; }

  if (state.sheet.type === 'member') {
    root.innerHTML = memberSheetHTML(state.sheet);
    if (state.sheet.creating) {
      const input = document.getElementById('member-name-input');
      if (input) {
        input.focus();
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); triggerSaveMember(); }
        });
      }
    }
  } else if (state.sheet.type === 'addCard') {
    root.innerHTML = addCardSheetHTML();
    wireAddCardSheet();
  } else if (state.sheet.type === 'editCard') {
    root.innerHTML = editCardSheetHTML(state.sheet.card);
    wireEditCardSheet(state.sheet.card);
  } else if (state.sheet.type === 'cardDetail') {
    root.innerHTML = cardDetailSheetHTML(state.sheet);
    const container = document.getElementById('card-detail-code');
    if (container) renderCode(container, state.sheet.card.code, state.sheet.card.codeType, 220);
  }
}

function triggerSaveMember() {
  const nameInput = document.getElementById('member-name-input');
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  const usedColors = new Set(state.members.map((m) => m.color));
  const suggestion = MEMBER_COLORS.find((c) => !usedColors.has(c)) || MEMBER_COLORS[0];
  const color = (state.sheet && state.sheet.color) || suggestion;
  createMember(name, color);
}

function wireAddCardSheet() {
  let selectedType = 'barcode';
  let logoData = null;

  const nameInput = document.getElementById('card-name-input');
  const codeInput = document.getElementById('card-code-input');
  const typeToggle = document.getElementById('card-type-toggle');
  const preview = document.getElementById('card-code-preview');
  const logoWrap = document.getElementById('card-logo-wrap');
  const logoInput = document.getElementById('card-logo-input');
  const colorInput = document.getElementById('card-color-input');
  const colorPreview = document.getElementById('card-color-preview');
  const saveBtn = document.getElementById('save-card-btn');

  nameInput.focus();
  nameInput.addEventListener('input', () => { colorPreview.textContent = nameInput.value.trim() || 'Voorbeeld'; });
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); codeInput.focus(); } });

  function updatePreview() {
    renderCode(preview, codeInput.value.trim(), selectedType, 180);
  }
  codeInput.addEventListener('input', updatePreview);
  codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); } });

  typeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-type]');
    if (!btn) return;
    selectedType = btn.dataset.type;
    typeToggle.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    updatePreview();
  });

  function renderLogoWrap() {
    logoWrap.innerHTML = '';
    if (!logoData) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-secondary full';
      btn.innerHTML = icon('upload', 18) + ' Kies logo';
      btn.addEventListener('click', () => logoInput.click());
      logoWrap.appendChild(btn);
      return;
    }
    const row = document.createElement('div');
    row.className = 'logo-preview-row';
    const img = document.createElement('img');
    img.src = logoData;
    img.className = 'logo-thumb';
    row.appendChild(img);
    const otherBtn = document.createElement('button');
    otherBtn.type = 'button';
    otherBtn.className = 'btn-secondary';
    otherBtn.textContent = 'Andere kiezen';
    otherBtn.addEventListener('click', () => logoInput.click());
    row.appendChild(otherBtn);
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'icon-btn muted';
    removeBtn.innerHTML = icon('x', 16);
    removeBtn.addEventListener('click', () => { logoData = null; renderLogoWrap(); });
    row.appendChild(removeBtn);
    logoWrap.appendChild(row);
  }
  renderLogoWrap();

  logoInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 160;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        logoData = canvas.toDataURL('image/png');
        renderLogoWrap();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  colorInput.addEventListener('input', () => {
    colorPreview.style.background = colorInput.value;
    colorPreview.style.color = textColorFor(colorInput.value);
  });

  saveBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const code = codeInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    if (!code) { codeInput.focus(); return; }
    saveBtn.disabled = true;
    await saveNewCard({ name, color: colorInput.value, code, codeType: selectedType, logo: logoData });
  });
}

document.getElementById('sheet-root').addEventListener('click', (e) => {
  if (e.target.classList.contains('sheet-backdrop')) {
    const s = state.sheet;
    if (s && s.closable) { state.sheet = null; renderSheetRoot(); }
  }
});

  await setDoc(doc(db, 'loyaltyCards', id), data);

  renderSheetRoot();
  await deleteDoc(doc(db, 'loyaltyCards', id));
}

  state.sheet = null;
  renderSheetRoot();
  const data = { name, color, code, codeType, memberId: memberId || null };
  if (logo) data.logo = logo;
  await setDoc(doc(db, 'loyaltyCards', id), data);

document.body.addEventListener('submit', async (e) => {
  if (e.target.matches && e.target.matches('[data-action="submit-add-item"]')) {
    e.preventDefault();
    const form = e.target;
    const name = form.elements['name'].value.trim();
    if (!name) return;
    const amount = form.elements['amount'].value.trim();
    const weight = form.elements['weight'].value.trim();
    form.reset();
    form.elements['name'].focus();
    await addItem({ name, amount, weight });
  }
  if (e.target.matches && e.target.matches('[data-action="submit-add-purchase"]')) {
    e.preventDefault();
    const form = e.target;
    const name = form.elements['name'].value.trim();
    if (!name) return;
    const amount = form.elements['amount'].value.trim();
    const weight = form.elements['weight'].value.trim();
    form.reset();
    form.elements['name'].focus();
    await addPurchaseItem({ name, amount, weight });
  }
});

document.body.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const value = el.dataset.value;

  switch (action) {
    case 'open-switcher':
      state.sheet = { type: 'member', creating: false, closable: true };
      renderSheetRoot();
      break;
    case 'close-sheet':
      if (state.sheet && state.sheet.closable) { state.sheet = null; renderSheetRoot(); }
      break;
    case 'pick-member':
      await pickMember(id);
      break;
    case 'start-create-member':
      state.sheet = { type: 'member', creating: true, closable: state.sheet.closable, name: '', color: null };
      renderSheetRoot();
      break;
    case 'back-to-member-list':
      state.sheet = { type: 'member', creating: false, closable: state.sheet.closable };
      renderSheetRoot();
      break;
    case 'choose-swatch': {
      const nameInput = document.getElementById('member-name-input');
      state.sheet.name = nameInput ? nameInput.value : (state.sheet.name || '');
      state.sheet.color = value;
      renderSheetRoot();
      break;
    }
    case 'save-member':
      triggerSaveMember();
      break;
    case 'set-tab':
      state.tab = value;
      renderApp();
      break;
    case 'set-listsub':
      state.listSub = value;
      renderSegmented();
      renderView();
      break;
    case 'buy-item':
      await buyItem(id);
      break;
    case 'delete-item':
      await deleteItem(id);
      break;
    case 'restore-log':
      await restoreLogItem(id);
      break;
    case 'purge-log':
      await purgeLogItem(id);
      break;
    case 'set-purchasesub':
      state.purchaseSub = value;
      renderSegmented();
      renderView();
      break;
    case 'buy-purchase':
      await buyPurchaseItem(id);
      break;
    case 'delete-purchase':
      await deletePurchaseItem(id);
      break;
    case 'restore-purchase-log':
      await restorePurchaseLogItem(id);
      break;
    case 'purge-purchase-log':
      await purgePurchaseLogItem(id);
      break;
    case 'open-wishlist':
      state.wishlistMemberId = id;
      renderView();
      break;
    case 'back-to-wishlist-members':
      state.wishlistMemberId = null;
      renderView();
      break;
    case 'delete-wishlist-item':
      await deleteWishlistItem(id);
      break;
    case 'share-wishlist-pdf':
      generateWishlistPDF(id);
      break;
    case 'open-add-card':
      state.sheet = { type: 'addCard', closable: true };
      renderSheetRoot();
      break;
    case 'open-card': {
      const card = state.cards.find((c) => c.id === id);
      if (!card) return;
      state.sheet = { type: 'cardDetail', card, closable: true };
      renderSheetRoot();
      break;
    }
    case 'edit-card': {
      const card = state.cards.find((c) => c.id === id);
      if (!card) return;
      state.sheet = { type: 'editCard', card, closable: true };
      renderSheetRoot();
      break;
    }
    case 'delete-card':
      await deleteCard(id);
      break;
  }
});

const ready = { members: false, items: false, log: false, cards: false, purchaseItems: false, purchaseLog: false, wishlistItems: false };
function checkReady() {
  if (Object.values(ready).every(Boolean)) {
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('app-content').style.display = 'block';
    renderApp();
    if (!currentMember()) {
      state.sheet = { type: 'member', creating: state.members.length === 0, closable: false };
      renderSheetRoot();
    }
  }
}

function startListeners() {
  onSnapshot(collection(db, 'familyMembers'), (snap) => {
    state.members = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    ready.members = true;
    checkReady();
    renderTopbar();
    if (state.sheet && state.sheet.type === 'member' && !state.sheet.creating) renderSheetRoot();
  }, (err) => showFatalError(err));

  onSnapshot(collection(db, 'shoppingItems'), (snap) => {
    state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    ready.items = true;
    checkReady();
    renderSegmented();
    if (state.tab === 'list' && state.listSub === 'active') renderView();
  }, (err) => showFatalError(err));

  onSnapshot(collection(db, 'shoppingLog'), (snap) => {
    state.log = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.boughtAt - a.boughtAt);
    ready.log = true;
    checkReady();
    renderSegmented();
    if (state.tab === 'list' && state.listSub === 'log') renderView();
  }, (err) => showFatalError(err));

  onSnapshot(collection(db, 'purchaseItems'), (snap) => {
    state.purchaseItems = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    ready.purchaseItems = true;
    checkReady();
    renderSegmented();
    if (state.tab === 'purchases' && state.purchaseSub === 'active') renderView();
  }, (err) => showFatalError(err));

  onSnapshot(collection(db, 'purchaseLog'), (snap) => {
    state.purchaseLog = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.boughtAt - a.boughtAt);
    ready.purchaseLog = true;
    checkReady();
    renderSegmented();
    if (state.tab === 'purchases' && state.purchaseSub === 'log') renderView();
  }, (err) => showFatalError(err));

  onSnapshot(collection(db, 'wishlistItems'), (snap) => {
    state.wishlistItems = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    ready.wishlistItems = true;
    checkReady();
    if (state.tab === 'wishlist') renderView();
  }, (err) => showFatalError(err));

  onSnapshot(collection(db, 'loyaltyCards'), (snap) => {
    state.cards = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    ready.cards = true;
    checkReady();
    if (state.tab === 'cards') renderView();
  }, (err) => showFatalError(err));
}

function showFatalError(err) {
  console.error(err);
  const el = document.getElementById('loading-view');
  el.className = 'loading-wrap error';
  el.textContent = 'Kan niet verbinden met de gedeelde lijst. Controleer je internetverbinding en of firebaseConfig correct is ingevuld.';
}

if (firebaseReady) {
  startListeners();
} else {
  showFatalError(firebaseError);
}
